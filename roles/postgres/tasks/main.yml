---
- name: Instalar PostgreSQL no RedHat
  ansible.builtin.dnf:
    name: "{{ postgres_packages_redhat }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"


- name: Inicializar banco PostgreSQL no Fedora
  ansible.builtin.command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: ansible_facts['os_family'] == "RedHat"


- name: Instalar PostgreSQL no Debian
  ansible.builtin.apt:
    name: "{{ postgres_packages_debian }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"


- name: Habilitar serviço PostgreSQL
  ansible.builtin.systemd:
    name: "{{ postgres_service }}"
    enabled: true
    state: started
