---
- name: Instalar OBS Studio no RedHat
  ansible.builtin.dnf:
    name: "{{ obs_studio_package }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"


- name: Instalar OBS Studio no Debian
  ansible.builtin.apt:
    name: obs-studio
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
