---
- name: Definir arquitetura k9s
  ansible.builtin.set_fact:
    k9s_arch: "{{ k9s_arch_map[ansible_facts['architecture']] }}"


- name: Baixar k9s
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_Linux_{{ k9s_arch }}.tar.gz"
    dest: "/tmp/k9s.tar.gz"
    mode: "0644"


- name: Criar diretório temporário k9s
  ansible.builtin.file:
    path: /tmp/k9s
    state: directory
    mode: "0755"


- name: Extrair k9s
  ansible.builtin.unarchive:
    src: /tmp/k9s.tar.gz
    dest: /tmp/k9s
    remote_src: true


- name: Instalar k9s
  ansible.builtin.copy:
    src: /tmp/k9s/k9s
    dest: /usr/local/bin/k9s
    mode: "0755"
    remote_src: true
