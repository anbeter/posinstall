---
- name: Instalar ZSH no RedHat
  ansible.builtin.dnf:
    name: "{{ zsh_package }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"


- name: Instalar ZSH no Debian
  ansible.builtin.apt:
    name: "{{ zsh_package }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"


- name: Instalar plugins ZSH no RedHat
  ansible.builtin.dnf:
    name: "{{ zsh_plugins }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"


- name: Instalar plugins ZSH no Debian
  ansible.builtin.apt:
    name: "{{ zsh_plugins }}"
    state: present
  when: ansible_facts['os_family'] == "Debian"
