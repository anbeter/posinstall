---
- name: Instalar ferramentas PDF no RedHat
  ansible.builtin.dnf:
    name: "{{ pdf_packages_redhat }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"


- name: Instalar ferramentas PDF no Debian
  ansible.builtin.apt:
    name: "{{ pdf_packages_debian }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
