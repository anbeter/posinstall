---
- name: Atualizar cache
  ansible.builtin.apt:
    update_cache: true
  when: common_upgrade_system

- name: Atualizar sistema
  ansible.builtin.apt:
    upgrade: dist
  when: common_upgrade_system

- name: Instalar pacotes básicos
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  when: common_install_packages

